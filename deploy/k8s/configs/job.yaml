management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    org.springframework: info
    com.hcp: debug
  file_basePath: ./logs
  file_prefix: ${spring.application.name}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    refresh-mapper: true
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.hcp.common.mybatisplus
hcp:
  tenant:
    ignore-tables:
    - sys_config
    - gen_table
    - gen_table_column
    - sys_dict_data
    - sys_dict_type
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_oper_log
    - sys_logininfor
    - branch_table
    - global_table
    - lock_table
    - undo_log
    - xxl_job_group
    - xxl_job_info
    - xxl_job_lock
    - xxl_job_log
    - xxl_job_log_report
    - xxl_job_logglue
    - xxl_job_registry
    - xxl_job_user
    - c_city
