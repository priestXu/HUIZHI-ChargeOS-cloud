apiVersion: v1
kind: ConfigMap
metadata:
  name: hcp-gateway-config
  namespace: ows-fd-evcp
data:
  application.yml: |
    spring:
      mail:
        host: smtp.qq.com
        username: 544023561884@qq.com
        password: csgzzhyuoxtxbega
        port: 465
        default-encoding: UTF-8
        properties:
          mail:
            smtp:
              ssl:
                enable: true
              socketFactoryClass: javax.net.ssl.SSLSocketFactory
            debug: true
      cloud:
        openfeign:
          sentinel:
            enabled: true
          okhttp:
            enabled: true
          httpclient:
            enabled: false
          client:
            config:
              default:
                connectTimeout: 10000
                readTimeout: 10000
              vctgo-job:
                connectTimeout: 100000
                readTimeout: 100000
          compression:
            request:
              enabled: true
            response:
              enabled: true
        gateway:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
          - id: hcp-auth
            uri: lb://hcp-auth
            predicates:
            - Path=/auth/**
            filters:
            - CacheRequestFilter
            - ValidateCodeFilter
            - StripPrefix=1
          - id: hcp-gen
            uri: lb://hcp-gen
            predicates:
            - Path=/code/**
            filters:
            - StripPrefix=1
          - id: hcp-system
            uri: lb://hcp-system
            predicates:
            - Path=/system/**
            filters:
            - StripPrefix=1
          - id: hcp-file
            uri: lb://hcp-file
            predicates:
            - Path=/file/**
            filters:
            - StripPrefix=1
          - id: hcp-monitor
            uri: lb://hcp-monitor
            predicates:
            - Path=/monitor/**
            filters:
            - StripPrefix=1
          - id: hcp-job
            uri: lb://hcp-job
            predicates:
            - Path=/job/**
            filters:
            - StripPrefix=1
          - id: hcp-operator
            uri: lb://hcp-operator
            predicates:
            - Path=/operator/**
            filters:
            - StripPrefix=1
          - id: hcp-mp
            uri: lb://hcp-mp
            predicates:
            - Path=/mp/**
            filters:
            - StripPrefix=1
          - id: hcp-simulator
            uri: lb://hcp-simulator
            predicates:
            - Path=/simulator/**
            filters:
            - StripPrefix=1
        nacos:
          config:
            enabled: false
          discovery:
            server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
            namespace: hcp
      data:
        redis:
          host: 192.168.20.176
          port: 16379
          database: 122
          password: '1234567890'
          timeout: 3000ms
          lettuce:
            pool:
              max-active: 20
              max-wait: 500ms
              max-idle: 10
              min-idle: 2
      jackson:
        time-zone: GMT+8
    management:
      endpoints:
        web:
          exposure:
            include: '*'
    logging:
      level:
        org.springframework: info
        com.hcp: debug
      file_basePath: ./logs
      file_prefix: ${spring.application.name}
    mybatis-plus:
      mapper-locations: classpath*:mapper/**/*.xml
      global-config:
        banner: false
        refresh-mapper: true
        db-config:
          id-type: auto
          table-underline: true
          logic-delete-value: 1
          logic-not-delete-value: 0
      configuration:
        map-underscore-to-camel-case: true
      type-handlers-package: com.hcp.common.mybatisplus
    hcp:
      tenant:
        ignore-tables:
        - sys_config
        - gen_table
        - gen_table_column
        - sys_dict_data
        - sys_dict_type
        - sys_menu
        - sys_tenant
        - sys_tenant_package
        - sys_oper_log
        - sys_logininfor
        - branch_table
        - global_table
        - lock_table
        - undo_log
        - xxl_job_group
        - xxl_job_info
        - xxl_job_lock
        - xxl_job_log
        - xxl_job_log_report
        - xxl_job_logglue
        - xxl_job_registry
        - xxl_job_user
        - c_city
    aliyun:
      endpoint: cn-shanghai
      accessKeyId: null
      accessKeySecret: null
      signName: null
      templateCode: null
    file:
      domain: http://127.0.0.1:39300
      path: /home/upload
      prefix: /documents
    security:
      captcha:
        enabled: false
        type: math
      xss:
        enabled: true
        excludeUrls:
        - /system/notice
      ignore:
        whites:
        - /auth/logout
        - /auth/login
        - /auth/register
        - /*/v3/api-docs
        - /csrf
        - /job/api/callback
        - /job/api/registry
        - /job/api/registryRemove
        - /file/documents/**
        - /hcp-mp/**
        - /hcp-operator/websocket/charge/**
